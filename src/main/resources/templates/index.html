<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereum RPC Gateway</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px auto;
            max-width: 720px;
            line-height: 1.5;
            padding: 0 16px;
        }

        input, button {
            font-size: 16px;
            padding: 10px 12px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button {
            cursor: pointer;
        }

        pre {
            background: #f4f4f4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
<h1>Sepolia Wallet Balance</h1>
<p>Ethereum 지갑 주소를 입력하면 서버가 Sepolia RPC를 호출해 잔액을 조회합니다.</p>

<label for="address">Wallet Address</label>
<input id="address" type="text" placeholder="0x...">
<button id="submitButton" type="button">잔액 조회</button>

<h2>결과</h2>
<pre id="result">아직 조회하지 않았습니다.</pre>

<script>
    const addressInput = document.getElementById("address");
    const submitButton = document.getElementById("submitButton");
    const result = document.getElementById("result");

    async function fetchBalance() {
        const address = addressInput.value.trim();

        if (!address) {
            result.textContent = "지갑 주소를 입력해주세요.";
            return;
        }

        result.textContent = "조회 중...";

        try {
            const response = await fetch(`/api/balances/${address}`);
            const data = await response.json();

            if (!response.ok) {
                result.textContent = JSON.stringify(data, null, 2);
                return;
            }

            result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            result.textContent = `요청 중 오류가 발생했습니다: ${error.message}`;
        }
    }

    submitButton.addEventListener("click", fetchBalance);
    addressInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            fetchBalance();
        }
    });
</script>
</body>
</html>
